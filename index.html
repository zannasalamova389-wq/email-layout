<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natural Skin Care — Письмо</title>
</head>
<body style="margin: 0; padding: 0; background-color: #f5f0eb; font-family: Arial, sans-serif;">

    <!-- Контейнер -->
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5f0eb; padding: 20px 0;">
        <tr>
            <td align="center">

                <!-- Основной блок (600px) -->
                <table width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 10px; overflow: hidden; max-width: 600px;">

                    <!-- Шапка с логотипом -->
                    <tr>
                        <td style="background-color: #ffffff; padding: 30px; text-align: center;">
                            <img src="images/alogo.png" alt="BRAND" style="width: 150px; height: auto; display: block; margin: 0 auto;">
                        </td>
                    </tr>

                    <!-- Баннер -->
                    <tr>
                        <td style="padding: 0;">
                            <img src="images/banner.jpg" alt="Естественная забота о вашей коже" style="width: 100%; display: block;">
                        </td>
                    </tr>

                    <!-- Текст и кнопка -->
                    <tr>
                        <td style="padding: 40px 30px; text-align: center; background-color: #faf6f1;">
                            <h2 style="color: #4a3c31; margin: 0 0 15px 0; font-size: 24px; font-family: Georgia, serif;">
                                Профессиональная косметика
                            </h2>
                            <p style="color: #6b5b4f; font-size: 16px; line-height: 1.6; margin: 0 0 25px 0;">
                                На основе природных компонентов. Забота о вашей красоте каждый день.
                            </p>

                            <!-- Кнопка -->
                            <table cellpadding="0" cellspacing="0" style="margin: 0 auto;">
                                <tr>
                                    <td style="border: 2px solid #4a3c31; border-radius: 5px;">
                                        <a href="https://ваш-сайт.ru" style="display: inline-block; padding: 15px 40px; color: #4a3c31; text-decoration: none; font-size: 16px; font-weight: bold; font-family: Arial, sans-serif;">
                                            Узнать больше
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Картинка с товарами -->
                    <tr>
                        <td style="padding: 0;">
                            <img src="images/products.jpg" alt="Наша косметика" style="width: 100%; display: block;">
                        </td>
                    </tr>

                    <!-- Подвал -->
                    <tr>
                        <td style="background-color: #4a3c31; padding: 25px; text-align: center;">
                            <p style="color: #ffffff; font-size: 14px; margin: 0 0 10px 0;">
                                © 2026 BRAND. Natural Skin Care.
                            </p>
                            <p style="color: #c9b8a8; font-size: 12px; margin: 0 0 15px 0;">
                                Вы получили это письмо, потому что подписались на нашу рассылку.
                            </p>
                            <!-- Ссылка «Отписаться» -->
                            <a href="#" style="color: #c9b8a8; font-size: 12px; text-decoration: underline;">
                                Отписаться от рассылки
                            </a>
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
